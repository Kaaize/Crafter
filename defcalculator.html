    <h1>Calculadora de Defesa</h1>
    <hr>
        <div class="info-input">
            <div class="defense-info">
                <h1>Informações</h1>
                <div class="block-info">
                    <label>Vida:</label>
                    <input type="number" id="hp" class="form-control" value=0 placeholder="100000">
                </div>
                <div class="block-info">
                    <label>Fator de Defesa:</label>
                    <input type="number" id="def_fator" class="form-control" value=0 placeholder="2800">
                </div>
                <div class="block-info">
                    <label>Armadura:</label>
                    <input type="number" id="armor" class="form-control" value=0 placeholder="5000">
                </div>
                <div class="block-info">
                    <label>Bônus de Armadura (%):</label>
                    <input type="number" id="armor_bonus" class="form-control" value=0 placeholder="100">
                </div>
                <div class="block-info">
                    <label>Redução de Dano Final (%):</label>
                    <input type="number" id="rdf" class="form-control" value=0 placeholder="15">
                </div>
            </div>            
        </div>   
        <div class="info-input">
            <div class="defense-info">
                <h1>Resultados</h1>
                <div class="block-info">
                    <label>Efetividade da Vida:</label>
                    <input type="number" id="hp_effecttiveness" class="form-control" value=0 readonly>
                </div>
                <div class="block-info">
                    <label>Vida Efetiva:</label>
                    <input type="number" id="effect_hp" class="form-control" value=0 readonly>
                </div>                
            </div>     
                   
        </div>              
    </div>
    <script src="defcalculator.js"></script>
