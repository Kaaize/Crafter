<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" type="text/css" href="defcalculator.css">
    <link rel="stylesheet" href="menu.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Calculadora de Defesa</title>
</head>

<body>
    <nav>
        <div class="menu-container">
            <div class="logo">
                <a href="index.html"><img src="imgs/rocket.png"></a>
            </div>
            <div class="dropdown-container">
                <div class="menu-icon">
                    <img src="imgs/GLA.ico">
                    <div class="dropdown-content">
                        <a href="crafter.html"><img
                                src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Calculadora de Crafts</a>

                        <a href="calcpots.html"><img
                                src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Calculadora de Pots</a>
                        <a href="puzzles.html"><img
                                src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Quebra-Cabeças</a>
                        <a href="mirrors.html"><img
                                src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Espelhos</a>
                        <a href="torch.html"><img src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Puzzle
                            Tocha</a>
                        <a href="defcalculator.html"><img
                                src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Calculadora de Def</a>
                    </div>
                </div>
                <div class="menu-icon">
                    <img src="imgs/PXG.ico">
                    <div class="dropdown-content">
                        <a href=""><img src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Boost</a>
                        <a href=""><img src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Craft</a>
                        <a href=""><img src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Celebi</a>
                        <a href="finder.html"><img src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Finder</a>
                    </div>
                </div>
                <div class="menu-icon">
                    <img src="imgs/drakantos.png">
                    <div class="dropdown-content">
                        <a href="builder.html"><img
                                src="https://wiki.gla.com.br/images/5/53/Diamondstar.png">Builder</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Setup 1 -->
        <div class="panel setup-panel">
            <h2>Setup 1</h2>
            <div class="form-group">
                <label>Vida</label>
                <input type="number" id="hp" value=0 placeholder="100000">
            </div>
            <div class="form-group">
                <label>Fator Defesa</label>
                <input type="number" id="def_fator" value=0 placeholder="2800">
            </div>
            <div class="form-group">
                <label>Armadura</label>
                <input type="number" id="armor" value=0 placeholder="5000">
            </div>
            <div class="form-group">
                <label>Bônus Armadura %</label>
                <input type="number" id="armor_bonus" value=0 placeholder="100">
            </div>
            <div class="form-group">
                <label>Redução Dano %</label>
                <input type="number" id="rdf" value=0 placeholder="15">
            </div>

            <div class="panel-result">
                <h3>Efetividade</h3>
                <input type="text" id="hp_effecttiveness" readonly>
                <h3>Vida Efetiva</h3>
                <input type="text" id="effect_hp" readonly>
            </div>
        </div>

        <!-- Setup 2 -->
        <div class="panel setup-panel">
            <h2>Setup 2</h2>
            <div class="form-group">
                <label>Vida</label>
                <input type="number" id="hp2" value=0 placeholder="100000">
            </div>
            <div class="form-group">
                <label>Fator Defesa</label>
                <input type="number" id="def_fator2" value=0 placeholder="2800">
            </div>
            <div class="form-group">
                <label>Armadura</label>
                <input type="number" id="armor2" value=0 placeholder="5000">
            </div>
            <div class="form-group">
                <label>Bônus Armadura %</label>
                <input type="number" id="armor_bonus2" value=0 placeholder="100">
            </div>
            <div class="form-group">
                <label>Redução Dano %</label>
                <input type="number" id="rdf2" value=0 placeholder="15">
            </div>

            <div class="panel-result">
                <h3>Efetividade</h3>
                <input type="text" id="hp_effecttiveness2" readonly>
                <h3>Vida Efetiva</h3>
                <input type="text" id="effect_hp2" readonly>
            </div>
        </div>

        <!-- Comparison Results -->
        <div class="panel results-panel">
            <h2>Diferença (2 - 1)</h2>
            <div class="diff-group">
                <label>Diferença Efetividade</label>
                <input type="text" id="dif_hp_effecttiveness" readonly>
            </div>
            <div class="diff-group">
                <label>Diferença Vida Efetiva</label>
                <input type="text" id="dif_effect_hp" readonly>
            </div>
        </div>
    </div>

    <script src="defcalculator.js"></script>
</body>

</html>
