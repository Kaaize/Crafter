<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimap Interactive Viewer</title>
    <link rel="stylesheet" href="finder.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="finder-container">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar-glass">
            <h2 class="sidebar-title">FOV Visualizer</h2>

            <!-- Coord Inputs -->
            <div class="control-group">
                <label>Coordinates</label>
                <div class="input-row">
                    <input type="number" id="input-x" placeholder="X" aria-label="X Coordinate">
                    <input type="number" id="input-y" placeholder="Y" aria-label="Y Coordinate">
                    <button id="btn-paste" title="Paste from Clipboard" aria-label="Paste coordinates from clipboard" onclick="pasteAndFill()">📋</button>
                </div>
            </div>

            <div class="control-group">
                <label>Position Z (Floor)</label>
                <div class="floor-controls">
                    <button id="floor-up" onclick="changeFloor(-1)" aria-label="Floor Up" title="Floor Up">▲</button>
                    <input type="number" id="input-z" value="7" disabled aria-label="Current Floor">
                    <button id="floor-down" onclick="changeFloor(1)" aria-label="Floor Down" title="Floor Down">▼</button>
                </div>
            </div>

            <!-- Compass -->
            <div id="compass-container">
                <div class="compass">
                    <div class="compass-row">
                        <button class="dir-btn nw" onclick="handleCompassClick('NW')" aria-label="North West" title="North West">NW</button>
                        <button class="dir-btn n" onclick="handleCompassClick('N')" aria-label="North" title="North">N</button>
                        <button class="dir-btn ne" onclick="handleCompassClick('NE')" aria-label="North East" title="North East">NE</button>
                    </div>
                    <div class="compass-row">
                        <button class="dir-btn w" onclick="handleCompassClick('W')" aria-label="West" title="West">W</button>
                        <div class="compass-center"></div>
                        <button class="dir-btn e" onclick="handleCompassClick('E')" aria-label="East" title="East">E</button>
                    </div>
                    <div class="compass-row">
                        <button class="dir-btn sw" onclick="handleCompassClick('SW')" aria-label="South West" title="South West">SW</button>
                        <button class="dir-btn s" onclick="handleCompassClick('S')" aria-label="South" title="South">S</button>
                        <button class="dir-btn se" onclick="handleCompassClick('SE')" aria-label="South East" title="South East">SE</button>
                    </div>
                </div>
            </div>

            <div id="vector-header">Active Vectors</div>
            <div id="vector-list">
                <!-- Vector items will appear here -->
            </div>

            <div id="status"></div>

            <div class="bottom-controls">
                <div id="cursor-coords">Hover map to see coords</div>
                <div id="nav-controls">
                    <button onclick="zoomIn()" aria-label="Zoom In" title="Zoom In">+</button>
                    <button onclick="zoomOut()" aria-label="Zoom Out" title="Zoom Out">-</button>
                    <button onclick="resetView()" aria-label="Reset View" title="Reset View">Reset</button>
                </div>
            </div>
        </div>

        <!-- Map Area -->
        <div id="map-viewport">
            <div id="map-loading">Loading Map...</div>
            <div id="map-container">
                <div id="map-content">
                    <canvas id="map-canvas"></canvas>
                </div>
            </div>
            <canvas id="vector-canvas"></canvas>
        </div>
    </div>

    <script src="otmm_data.js"></script>
    <script src="otmm.js"></script>
    <script src="finder.js"></script>
</body>

</html>
